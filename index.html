<style>
:root{
  --bg:#000;--panel:#0b0b0b;--fg:#f2f2f2;--mute:#8c8c8c;--line:#1f1f1f;--lime:#c8ff00;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Instrument Serif","Times New Roman",serif;
  --pad:clamp(20px,4vw,56px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg);scroll-padding-top:70px}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
img{display:block;max-width:100%}
.metal{background:linear-gradient(180deg,#fff 5%,#d9d9d9 40%,#5d5d5d 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.metal.display{padding-bottom:.14em}
.display{font-weight:900;font-stretch:125%;letter-spacing:-.045em;line-height:.85}
.ital{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0}
.h-xl{font-size:clamp(48px,11vw,170px)}
.h-lg{font-size:clamp(40px,8vw,120px)}

/* nav */
.nav{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px var(--pad);background:linear-gradient(rgba(2,3,10,.82) 35%,rgba(2,3,10,0))}
.brand{font-weight:900;font-stretch:125%;letter-spacing:-.02em;font-size:15px}
.links{display:flex;gap:clamp(12px,1.8vw,26px);list-style:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;align-items:center}
.links a:hover,.links button:hover{opacity:.6}
.links .pill{font-size:12px;padding:8px 16px;letter-spacing:.04em;text-transform:none}
.menu{display:none;font-size:13px;font-weight:700;border:1px solid #333;border-radius:999px;padding:8px 16px;background:#0d0d0d}
@media(max-width:980px){
  .menu{display:block}
  .links{position:fixed;inset:0;background:#02030a;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;padding:0 var(--pad);font-size:clamp(34px,10vw,56px);letter-spacing:-.03em;text-transform:none;font-weight:900;font-stretch:112%;opacity:0;pointer-events:none;transition:opacity .3s;z-index:-1}
  .links.open{opacity:1;pointer-events:auto}
  .links .pill{font-size:15px;margin-top:10px}
  .menu{position:relative;z-index:2}
}

/* pills */
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 20px;font-size:13px;font-weight:600;border:1px solid #333;background:#0d0d0d;color:var(--fg);transition:background .25s,color .25s,border-color .25s}
.pill:hover{border-color:#777}
.pill.lime{background:var(--lime);color:#000;border-color:var(--lime)}
.pill.lime:hover{background:#dfff55}
.pill.white{background:#fff;color:#000;border-color:#fff}
.pill.black{background:#000;color:#fff;border-color:#000}
.mag{will-change:transform}

/* hero */
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden;isolation:isolate}
.hero .title{position:absolute;left:0;right:0;bottom:15%;z-index:1;text-align:center;white-space:nowrap;font-size:18vw;
  transform:translate3d(0,0,0);will-change:transform}
.cutout{position:absolute;left:50%;bottom:0;z-index:2;width:min(125vw,82svh,920px);aspect-ratio:1;
  transform:translate3d(-50%,0,0);will-change:transform}
.cutout img{width:100%;height:100%;object-fit:contain;object-position:bottom}
.role{position:absolute;left:var(--pad);bottom:clamp(22px,5vh,48px);z-index:3;display:flex;flex-direction:column;gap:8px}
.role b{font-size:clamp(18px,2.2vw,28px);font-weight:700;display:flex;gap:.35em;align-items:baseline}
.role .ital{font-size:1.15em;color:#cfcfcf}
.open-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#cfcfcf}
.dot{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 0 0 rgba(16,185,129,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.hero-cta{position:absolute;right:var(--pad);bottom:clamp(22px,5vh,48px);z-index:3;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:700px){
  .hero .title{bottom:36%}
  .cutout{width:112vw}
  .role{bottom:132px}
  .hero-cta{left:var(--pad);right:var(--pad);justify-content:flex-start;bottom:22px}
}

/* intro */
.intro{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,64px);padding:12vh var(--pad) 8vh}
.intro .photo{position:sticky;top:10vh;align-self:start}
.intro .photo .cutout{position:relative;left:auto;bottom:auto;transform:none;width:100%}
.intro h2{margin-bottom:5vh}
.glass{max-width:620px;margin-left:auto;padding:clamp(18px,2.4vw,30px);border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.glass p{color:#d6d6d6;font-size:clamp(14px,1.15vw,16px);line-height:1.7}
.glass p+p{margin-top:1em}
.glass b{color:#fff}
.stats{display:flex;gap:clamp(18px,3vw,40px);flex-wrap:wrap;margin:24px 0 4px;padding-top:22px;border-top:1px solid rgba(255,255,255,.1)}
.stats b{display:block;font-size:clamp(26px,3vw,38px);font-weight:900;font-stretch:112%;letter-spacing:-.03em;line-height:1;color:var(--lime)}
.stats span{font-size:12px;color:var(--mute)}
.info{margin-top:18px}
.info a,.info div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.info span{color:var(--mute)}
.info b{font-weight:600;color:#fff;text-align:right;word-break:break-word}
.info a:hover b{color:var(--lime)}
.info .ok{color:#34d399}

/* marquee */
.stack{padding:0 0 10vh;overflow:hidden}
.mrow{display:flex;width:max-content;padding:clamp(8px,1.2vw,16px) 0;animation:mq 42s linear infinite;will-change:transform}
.mrow.rev{animation-direction:reverse}
@keyframes mq{to{transform:translate3d(-50%,0,0)}}
.stack.paused .mrow{animation-play-state:paused}
.mrow span{margin-right:clamp(28px,4vw,64px);font-size:clamp(14px,1.6vw,22px);font-weight:700;color:#bdbdbd;white-space:nowrap;transition:color .2s}
.mrow span:hover{color:var(--lime)}

/* skills accordion */
.sect{padding:10vh var(--pad)}
.sect-head{margin-bottom:6vh}
.sect-head.r{text-align:right}
.acc{border-top:1px solid var(--line)}
.acc-item{border-bottom:1px solid var(--line);background:transparent;transition:background .45s cubic-bezier(.7,0,.2,1),color .3s}
.acc-item.open{background:var(--lime);color:#000;border-color:var(--lime)}
.acc-head{width:100%;display:grid;grid-template-columns:clamp(36px,6vw,90px) 1fr auto;align-items:center;text-align:left;padding:clamp(16px,2.4vw,28px) clamp(4px,1vw,14px)}
.acc-head .n{font-size:13px;font-weight:600;opacity:.7}
.acc-head .t{font-size:clamp(14px,1.6vw,22px);font-weight:800;font-stretch:112%;letter-spacing:.01em;text-transform:uppercase}
.arrow{width:22px;height:22px;transition:transform .45s cubic-bezier(.7,0,.2,1);color:var(--lime);flex:none}
.acc-item.open .arrow{transform:rotate(180deg);color:#000}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.7,0,.2,1)}
.acc-item.open .acc-body{grid-template-rows:1fr}
.acc-body>div{overflow:hidden}
.acc-inner{display:grid;grid-template-columns:clamp(36px,6vw,90px) minmax(0,1fr);padding:6px clamp(4px,1vw,14px) clamp(22px,3vw,40px)}
.tg{grid-column:2;display:flex;flex-wrap:wrap;gap:8px}
.tg span{font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid rgba(0,0,0,.45)}
@media(max-width:700px){.acc-inner{grid-template-columns:1fr}.tg{grid-column:1}}

/* projects */
.work-head{padding:8vh var(--pad) 4vh}
.work-head h2 .ital{font-size:1.1em;color:#d4d4d4}
.proj{position:relative;min-height:100svh;display:flex;align-items:center;padding:clamp(70px,10vh,110px) var(--pad) clamp(40px,6vh,80px)}
.proj-inner{width:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:center;transform-origin:50% 0}
.stacking .proj-inner{will-change:transform,opacity}
.proj.flip .proj-inner{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.proj.flip .shot{order:2}
.shot{perspective:900px;cursor:pointer;display:block}
.shot img{width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:#fff;transition:box-shadow .3s;will-change:transform;backface-visibility:hidden}
.shot.hov img{box-shadow:0 0 50px rgba(200,255,0,.18)}
.proj .idx{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:12px}
.proj h3{font-size:clamp(26px,3.3vw,50px);font-weight:900;font-stretch:112%;letter-spacing:-.02em;line-height:1.02;text-transform:uppercase}
.proj dl{margin:20px 0 18px;display:grid;gap:12px;max-width:56ch}
.proj dt{font-size:12px;font-weight:700;color:var(--lime)}
.proj dd{color:#b5b5b5;font-size:clamp(14px,1.05vw,15px);line-height:1.6}
.metrics{display:flex;gap:clamp(18px,3vw,40px);flex-wrap:wrap;margin-bottom:18px;padding-top:16px;border-top:1px solid var(--line)}
.metrics b{display:block;font-size:clamp(22px,2.4vw,32px);font-weight:900;font-stretch:112%;letter-spacing:-.03em;line-height:1}
.metrics span{font-size:12px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tags span{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid #2a2a2a;color:#c4c4c4}
.projects.sticky .proj{position:sticky;top:0}
@media(max-width:900px){
  .proj-inner,.proj.flip .proj-inner{grid-template-columns:1fr}
  .proj.flip .shot{order:0}
  .proj{min-height:auto;padding-block:48px}
}

/* experience */
.exp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(24px,5vw,80px);align-items:start}
.exp-copy p{color:#a9a9a9;margin:22px 0 26px;max-width:42ch}
.tl .per{font-size:13px;color:var(--lime);font-weight:600}
.tl h3{font-size:clamp(22px,2.6vw,34px);font-weight:900;font-stretch:112%;letter-spacing:-.02em;line-height:1.1;margin:8px 0 4px}
.tl .co{color:#bdbdbd;font-size:14px;margin-bottom:16px}
.tl ul{margin:20px 0 0;padding-left:1.1em;color:#cfcfcf;font-size:14.5px;line-height:1.7}
.tl li+li{margin-top:8px}
.tl .tags{margin-bottom:0}
@media(max-width:800px){.exp{grid-template-columns:1fr}}

/* cta band */
.band{background:var(--lime);color:#000;padding:clamp(40px,8vw,90px) var(--pad);display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.band h2{font-size:clamp(28px,5vw,72px);font-weight:900;font-stretch:112%;letter-spacing:-.035em;line-height:.98;max-width:16ch}

/* education */
.edu{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(14px,2vw,24px)}
.edu .glass{max-width:none;margin:0}
.edu h3{font-size:clamp(18px,1.8vw,24px);font-weight:800;font-stretch:112%;letter-spacing:-.01em;line-height:1.2;margin-bottom:8px}
.edu p{color:#a9a9a9;font-size:14px;margin-bottom:16px}
.edu .tags{margin:0}
.edu .tags span.l{border-color:transparent;color:var(--mute);padding-left:0}

/* certifications */
.certs{border-top:1px solid var(--line)}
.cert{display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:center;padding:clamp(16px,2vw,24px) clamp(4px,1vw,14px);border-bottom:1px solid var(--line);transition:background .35s,color .25s}
.cert .cn{font-size:clamp(15px,1.5vw,20px);font-weight:800;font-stretch:108%;letter-spacing:-.005em}
.cert .cs{grid-column:1;color:var(--mute);font-size:13px}
.cert .go{grid-row:1/3;grid-column:2;width:20px;height:20px;color:var(--lime)}
.cert .st{grid-row:1/3;grid-column:2;font-size:12px;color:var(--mute);border:1px solid #2a2a2a;border-radius:999px;padding:4px 12px}
a.cert:hover{background:var(--lime);color:#000;border-color:var(--lime)}
a.cert:hover .cs,a.cert:hover .go{color:#000}

/* footer */
.foot{position:relative;z-index:2;padding:12vh var(--pad) 0;overflow:hidden}
.foot-top{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-end}
.foot h2{font-size:clamp(30px,5vw,72px);font-weight:900;font-stretch:112%;letter-spacing:-.035em;line-height:.98;max-width:13ch}
.foot h2 .ital{font-size:1.12em;color:#d4d4d4}
.foot-sub{color:var(--mute);margin-top:14px;max-width:48ch;font-size:14px}
.clinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin:9vh 0 4vh}
.clinks a,.clinks button{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;text-align:left;font-size:15px;font-weight:600;word-break:break-word}
.clinks span{font-size:12px;color:var(--mute);font-weight:500}
.clinks a:hover,.clinks button:hover{color:var(--lime)}
.wordmark{font-size:18vw;text-align:center;margin-bottom:-.12em;white-space:nowrap}
.legal{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:#5f5f5f;font-size:12px;padding:20px 0 24px;border-top:1px solid rgba(255,255,255,.08);position:relative}
.legal a:hover{color:var(--lime)}
.legal span+span{display:flex;gap:16px}

/* ---------- space theme ---------- */
#space{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#02030a}
#space .neb{position:absolute;inset:-25%;will-change:transform;animation:drift 110s ease-in-out infinite alternate;
  background:
   radial-gradient(38% 34% at 14% 16%,rgba(99,38,214,.34),transparent 70%),
   radial-gradient(34% 30% at 88% 26%,rgba(8,145,178,.26),transparent 70%),
   radial-gradient(42% 36% at 62% 92%,rgba(190,24,93,.20),transparent 70%),
   radial-gradient(30% 26% at 36% 58%,rgba(37,99,235,.18),transparent 70%)}
#space .neb.b{animation-duration:150s;animation-direction:alternate-reverse;opacity:.7;
  background:
   radial-gradient(26% 22% at 78% 70%,rgba(200,255,0,.07),transparent 70%),
   radial-gradient(30% 26% at 20% 84%,rgba(124,58,237,.22),transparent 70%)}
@keyframes drift{from{transform:translate3d(-3%,2%,0) scale(1.02) rotate(-1deg)}to{transform:translate3d(3%,-3%,0) scale(1.12) rotate(2deg)}}
#stars{position:absolute;inset:0;width:100%;height:100%}
main{position:relative;z-index:1}
.foot>*{position:relative;z-index:1}
.foot::before{content:"";position:absolute;z-index:0;left:50%;top:64%;width:170vw;height:170vw;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 50% 0%,#101a3d 0%,#070c22 38%,#02030a 70%);
  box-shadow:0 -3px 50px 4px rgba(120,160,255,.35),0 -1px 140px 30px rgba(99,102,241,.22),inset 0 6px 40px rgba(165,200,255,.28)}
@media(prefers-reduced-motion:reduce){#space .neb{animation:none}}


/* ---------- advanced space layers ---------- */
#nebula{position:absolute;inset:0;width:100%;height:100%;display:none}
#space.gl #nebula{display:block}
#space.gl .neb{display:none}
.planet{position:absolute;top:0;left:0;will-change:transform;font-size:clamp(5px,.9vw,14px);opacity:.58}
.planet .sph{position:absolute;inset:0;border-radius:50%;display:block}
.planet.gas{left:auto;right:-9vw;width:24em;height:24em}
.planet.gas .sph{
  background:
   radial-gradient(circle at 30% 26%,rgba(255,244,220,.85),transparent 36%),
   repeating-linear-gradient(176deg,#d9a566 0 7%,#bf8645 7% 13%,#e8c58f 13% 18%,#a86f36 18% 24%,#cf9a58 24% 29%),#b07a3f;
  box-shadow:inset -4.2em -2.8em 6em rgba(0,0,0,.88),inset 1.2em 1em 3em rgba(255,225,170,.18),0 0 5em rgba(255,190,120,.16)}
.planet .ringb,.planet .ringf{position:absolute;left:-44%;top:31%;width:188%;height:40%;border-radius:50%;transform:rotate(-17deg);
  background:radial-gradient(closest-side,transparent 56%,rgba(235,208,160,.5) 58%,rgba(214,184,134,.34) 68%,transparent 70.5%,rgba(232,202,152,.3) 74%,rgba(232,202,152,.46) 82%,transparent 86%)}
.planet .ringb{clip-path:inset(0 0 50% 0)}
.planet .ringf{clip-path:inset(50% 0 0 0)}
.planet.ice{left:-9vw;width:17em;height:17em}
.planet.ice .sph{
  background:
   radial-gradient(circle at 32% 28%,rgba(255,255,255,.5),transparent 34%),
   repeating-linear-gradient(168deg,#2b6cb0 0 9%,#3b8bd6 9% 16%,#1e4f8f 16% 25%,#4aa0e8 25% 30%),#2563a8;
  box-shadow:inset -3.2em -2.2em 5em rgba(0,0,12,.9),inset 0 0 1.6em rgba(150,205,255,.55),0 0 4.5em rgba(70,140,255,.38)}
.planet.moon{left:auto;right:6vw;width:10em;height:10em;opacity:.8}
.planet.moon .sph{
  background:
   radial-gradient(circle at 62% 36%,rgba(0,0,0,.2) 0 8%,transparent 9%),
   radial-gradient(circle at 38% 64%,rgba(0,0,0,.16) 0 12%,transparent 13%),
   radial-gradient(circle at 72% 70%,rgba(0,0,0,.18) 0 5.5%,transparent 6.5%),
